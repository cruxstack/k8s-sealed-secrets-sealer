name: ci

# Pull requests run it here; pushes to main run it from the release workflow,
# which releases only what passed.
on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  ATMOS_VERSION: 1.233.2

# Every job runs the same atmos command a developer runs locally; atmos
# installs the pinned toolchain (Go, linters, k3d, Tilt, Helm) itself and
# checks each download's build provenance with `gh attestation verify`, which
# needs a token (the job's read-only GITHUB_TOKEN is enough).
#
# The setup action restores each job's tools and Go, lint and npm caches from
# the latest run on main, and only runs on main save them again: a pull
# request reads main's caches and writes none, so it cannot change what
# another run builds with.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          atmos-version: ${{ env.ATMOS_VERSION }}
          cache: check
      - name: Static Checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: atmos check all
      - name: Web UI Checks (eslint, tsc, prettier)
        env:
          GH_TOKEN: ${{ github.token }}
        run: atmos web check
      - name: Release Files (Lambda zips, charts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: atmos release artifacts --version 0.0.0
      - name: Save Caches
        if: github.event_name != 'pull_request' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-paths }}
          key: ${{ steps.setup.outputs.cache-key }}

  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          atmos-version: ${{ env.ATMOS_VERSION }}
          cache: test
      - name: Unit Tests
        env:
          GH_TOKEN: ${{ github.token }}
        run: atmos test unit
      - name: Integration Tests (DynamoDB Local)
        env:
          GH_TOKEN: ${{ github.token }}
        run: atmos test integration
      - name: Web UI Tests (vitest)
        env:
          GH_TOKEN: ${{ github.token }}
        run: atmos web test
      - name: Save Caches
        if: github.event_name != 'pull_request' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-paths }}
          key: ${{ steps.setup.outputs.cache-key }}

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          atmos-version: ${{ env.ATMOS_VERSION }}
          cache: e2e
      - name: End-to-End Tests (k3d)
        env:
          GH_TOKEN: ${{ github.token }}
        run: atmos test e2e
      - name: Save Caches
        if: github.event_name != 'pull_request' && steps.setup.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.setup.outputs.cache-paths }}
          key: ${{ steps.setup.outputs.cache-key }}

  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [control-plane, agent]
    steps:
      - name: Checkout Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          # the runner is thrown away after the job
          cleanup: false
      - name: Build Container Image
        run: docker buildx build --platform linux/amd64,linux/arm64 --target "${{ matrix.target }}" --build-arg VERSION=ci .
