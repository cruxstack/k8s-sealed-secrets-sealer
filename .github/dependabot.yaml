version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      go-modules:
        patterns: ["*"]

  # base images in the Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/dev/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      docker:
        patterns: ["*"]
