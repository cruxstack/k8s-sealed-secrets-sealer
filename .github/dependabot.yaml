# Commit prefixes decide releases (docs/development.md, "Releases"): action
# updates change only CI and release nothing; Go modules and base images
# change what ships, so they release a patch.
version: 2
updates:
  - package-ecosystem: "github-actions"
    # the workflows, and the setup action they share
    directories:
      - "/"
      - "/.github/actions/*"
    commit-message:
      prefix: "ci"
      include: "scope"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: "gomod"
    directory: "/"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      go-modules:
        patterns: ["*"]

  # base images in the Dockerfiles
  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/dev/docker"
    commit-message:
      prefix: "build"
      include: "scope"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 5
    groups:
      docker:
        patterns: ["*"]
