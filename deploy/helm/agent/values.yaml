fullnameOverride: ""

# The agent Deployment uses the Recreate strategy: on an upgrade the old pod
# finishes its work (up to 45 seconds) and stops before the new one starts,
# pulls its image and checks in. The control plane counts an agent healthy
# for three check-in intervals, and at least 45 seconds, after its last
# check-in, so an upgrade whose new pod takes more than about 10 seconds to
# pull and start leaves the agent unhealthy for a while. An env whose only
# seal-capable agent is upgrading cannot seal meanwhile. Pre-pull the new
# image on the node (or the cluster's nodes) before upgrading to keep the gap
# short, and upgrade one cluster at a time.
image:
  repository: ghcr.io/cruxstack/k8s-sealed-secrets-sealer-agent
  # defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

# The sealed-secrets controller this agent works with. Run the controller in
# a namespace of its own: RBAC cannot narrow "list secrets" or "delete pods"
# by label, so the keys capability can read every Secret and delete any pod
# in that namespace. The chart refuses keys with kube-system.
controller:
  namespace: sealed-secrets
  # the controller's Service name (kubeseal's default)
  name: sealed-secrets-controller
  # the controller's Deployment; defaults to controller.name
  deploymentName: ""

# The env this agent's cluster belongs to (required), e.g. "dev". The agent
# names it on every request, so a control plane serving several envs sends
# it to this one; it refuses a control plane that answers for another env,
# and binds the keys it escrows to this one.
env: ""

# Capabilities decide which RBAC is installed and which commands the agent
# accepts. The control plane cannot change them. See docs/design.md. With
# all of them off the agent only reports its controller's active key.
capabilities:
  # seal values with the env key; needs only the controller's public cert
  seal: true
  # escrow and restore sealing keys; reads and creates key Secrets, and
  # restarts the controller after a restore by deleting its pods, one at a
  # time when it has several replicas. A delete is not an eviction, so the
  # controller's PodDisruptionBudget does not hold it back. Needs
  # kms.escrowKeyId.
  keys: false
  # turn on the controller's key renewal when no cluster in the env has it,
  # by setting --key-renew-period on the controller's Deployment. Kubernetes
  # cannot limit that permission to one argument: an agent with it can
  # change the Deployment in any way, and so act as the controller's service
  # account, which can read and write Secrets in every namespace. Give it to
  # as few agents as you can (one per env is enough), or set the
  # controller's own keyrenewperiod value and leave this off.
  renewal: false
  # count the values in the SealedSecrets the controller watches by the key
  # that sealed them, so an admin can delete keys nothing uses, and remove
  # keys an admin deleted from the controller. This adds the agent's only
  # cluster-wide permission: get and list SealedSecrets in every namespace,
  # which hold only ciphertext. It also lets the agent delete Secrets in the
  # controller's namespace, so it can delete keys there. Needs keys.
  cleanup: false

# The control plane this agent checks in with (required). It must be https;
# allowInsecure permits plain http for local stacks only.
controlPlane:
  url: ""
  allowInsecure: false

# How the agent logs in to the control plane:
#   k8s-oidc  a projected service-account token, verified against this
#             cluster's OIDC issuer
#   aws-sts   the pod's IAM role (EKS Pod Identity or IRSA, set up through
#             serviceAccount.annotations or a Pod Identity association),
#             proven with a signed sts:GetCallerIdentity request
# Either way the audience must match the control plane's agent audience,
# which is its public URL unless configured otherwise.
identity:
  mode: k8s-oidc
  # defaults to controlPlane.url, without a trailing slash
  audience: ""
  # lifetime of the projected token (k8s-oidc)
  expirationSeconds: 600

aws:
  # region of the STS endpoint the agent signs for (aws-sts); empty uses the
  # AWS SDK's region (AWS_REGION)
  region: ""

# KMS keys. The agent's IAM role (EKS Pod Identity or IRSA) needs:
#   transit  kms:Decrypt, only when the encryption context's agent_id is
#            this agent's ID (seal capability)
#   escrow   kms:GenerateDataKey and kms:Decrypt (keys capability)
# For a multi-Region key, use the replica in this cluster's region.
kms:
  # the key values to seal arrive encrypted under: ID, ARN or alias
  # (required with capabilities.seal)
  transitKeyId: ""
  # key ID, ARN or alias (required with capabilities.keys)
  escrowKeyId: ""
  # region of the KMS endpoint for keys not named by ARN; a key named by its
  # ARN (as a key in another account must be) is called in the ARN's region.
  # Empty uses the AWS SDK's region (AWS_REGION).
  region: ""
  # overrides the KMS endpoint, for local emulators only
  endpoint: ""

# How often the agent reads the controller and checks in, from 5s to 5m.
# The control plane counts the agent healthy for three intervals after its
# last check-in, and at least 45 seconds, and keeps choosing it for seals
# meanwhile, first for seals in its own region. So with a long interval an
# agent that stops is still sent seals for a long time: up to 15 minutes at
# 5m, each seal failing when it expires after 2 minutes. Keep the default
# unless check-ins cost too much, and run more than one seal-capable agent.
checkinInterval: 15s

# How often, at most, the agent counts the values sealed with each key, from
# 30s to 1h (cleanup capability). A count decrypts only the RSA part of each
# value that changed since the last, a few milliseconds each with 4096-bit
# keys; the control plane uses counts up to an hour old.
keyUsageInterval: 5m

# On shutdown the agent finishes the command it is running and reports its
# result, within 45 seconds (a held commands poll and a few commands), then
# reports those it could not finish as failed, within 10 more. Keep this
# above 55.
terminationGracePeriodSeconds: 60

log:
  level: info
  format: json

serviceAccount:
  create: true
  # defaults to the release's full name
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    memory: 128Mi

nodeSelector: {}
tolerations: []
affinity: {}

# extra environment variables for the agent container
extraEnv: []
