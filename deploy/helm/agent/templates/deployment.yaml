apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agent.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
spec:
  # one agent per cluster; commands are single-use, so a brief overlap during
  # a rollout is harmless
  replicas: 1
  selector:
    matchLabels:
      {{- include "agent.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agent.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "agent.serviceAccountName" . }}
      automountServiceAccountToken: true
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agent
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_HTTP_ADDR
              value: ":8081"
            - name: APP_CONTROLLER_NAMESPACE
              value: {{ .Values.controller.namespace | quote }}
            - name: APP_CONTROLLER_NAME
              value: {{ .Values.controller.name | quote }}
            - name: APP_CONTROLLER_DEPLOYMENT
              value: {{ include "agent.controllerDeployment" . | quote }}
            - name: APP_CONTROL_PLANE_URL
              value: {{ required "controlPlane.url is required" .Values.controlPlane.url | quote }}
            - name: APP_ALLOW_INSECURE_CONTROL_PLANE
              value: {{ .Values.controlPlane.allowInsecure | quote }}
            - name: APP_IDENTITY_MODE
              value: {{ include "agent.identityMode" . | quote }}
            - name: APP_IDENTITY_AUDIENCE
              value: {{ default .Values.controlPlane.url .Values.identity.audience | quote }}
            {{- if eq .Values.identity.mode "k8s-oidc" }}
            - name: APP_IDENTITY_TOKEN_FILE
              value: /var/run/secrets/k8s-sealed-secrets-sealer/token
            {{- end }}
            {{- with .Values.aws.region }}
            - name: APP_AWS_STS_REGION
              value: {{ . | quote }}
            {{- end }}
            - name: APP_ENV_NAME
              value: {{ required "env is required" .Values.env | quote }}
            - name: APP_CAPABILITIES
              value: {{ include "agent.capabilities" . | quote }}
            {{- if .Values.capabilities.seal }}
            - name: APP_KMS_TRANSIT_KEY_ID
              value: {{ required "kms.transitKeyId is required with the seal capability" .Values.kms.transitKeyId | quote }}
            {{- end }}
            {{- if .Values.capabilities.keys }}
            - name: APP_KMS_ESCROW_KEY_ID
              value: {{ required "kms.escrowKeyId is required with the keys capability" .Values.kms.escrowKeyId | quote }}
            {{- end }}
            {{- if or .Values.capabilities.seal .Values.capabilities.keys }}
            {{- with .Values.kms.region }}
            - name: APP_KMS_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.kms.endpoint }}
            - name: APP_KMS_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- end }}
            - name: APP_CHECKIN_INTERVAL
              value: {{ .Values.checkinInterval | quote }}
            - name: APP_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: APP_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if eq .Values.identity.mode "k8s-oidc" }}
          volumeMounts:
            - name: identity
              mountPath: /var/run/secrets/k8s-sealed-secrets-sealer
              readOnly: true
          {{- end }}
          ports:
            - name: probes
              containerPort: 8081
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      {{- if eq .Values.identity.mode "k8s-oidc" }}
      volumes:
        # the token the agent logs in to the control plane with; the kubelet
        # rotates it before it expires
        - name: identity
          projected:
            sources:
              - serviceAccountToken:
                  path: token
                  audience: {{ default .Values.controlPlane.url .Values.identity.audience | quote }}
                  expirationSeconds: {{ .Values.identity.expirationSeconds }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
