{{- $name := .Values.controller.name }}
{{- $deployment := include "agent.controllerDeployment" . }}
{{- if and .Values.capabilities.keys (eq .Values.controller.namespace "kube-system") }}
{{- fail "capabilities.keys needs the controller in a namespace of its own, not kube-system: it lets the agent list every Secret and delete any pod in the controller's namespace" }}
{{- end }}
{{- if and .Values.capabilities.cleanup (not .Values.capabilities.keys) }}
{{- fail "capabilities.cleanup needs capabilities.keys: it counts with the key Secrets and restarts the controller as key sync does" }}
{{- end }}
# Everything the agent may do is granted here, in the controller's namespace
# only, except that cleanup lists SealedSecrets in every namespace (below).
# See docs/design.md, "Agent RBAC".
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "agent.fullname" . }}
  namespace: {{ .Values.controller.namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
rules:
  # read the controller's public certificate through the API service proxy
  - apiGroups: [""]
    resources: ["services"]
    resourceNames: [{{ $name | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["services/proxy"]
    resourceNames:
      - {{ printf "http:%s:" $name | quote }}
      - {{ printf "http:%s:http" $name | quote }}
      - {{ $name | quote }}
    verbs: ["get"]
  # read the controller's flags (key renewal period and key order)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $deployment | quote }}]
    verbs: ["get"]
  {{- if .Values.capabilities.keys }}
  # list key Secrets for the key set and escrow, and create restored ones;
  # neither can be narrowed by name or label, which is why the controller
  # needs a namespace of its own
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["list", "create"]
  # the controller reads keys only when it starts: see which of its pods
  # predate a restored key, and delete them so its Deployment starts new
  # ones; pod names are generated, so this cannot be narrowed by name. A
  # delete is not an eviction: PodDisruptionBudgets do not apply.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "delete"]
  # tell the controller's pods from others its selector matches: a pod is
  # the controller's only when its ReplicaSet is the Deployment's
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["list"]
  {{- end }}
  {{- if .Values.capabilities.cleanup }}
  # delete the key Secrets of keys an admin deleted; cannot be narrowed by
  # name either
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["delete"]
  {{- end }}
  {{- if .Values.capabilities.renewal }}
  # set --key-renew-period in the controller's arguments. RBAC cannot narrow
  # a patch to one field, so this allows any change to the controller's
  # Deployment, and with it running anything as the controller's service
  # account. See "renewal" in the chart's values.
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: [{{ $deployment | quote }}]
    verbs: ["patch"]
  {{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "agent.fullname" . }}
  namespace: {{ .Values.controller.namespace }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "agent.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- if .Values.capabilities.cleanup }}
{{- $cluster := printf "%s-%s-sealedsecrets" .Release.Namespace (include "agent.fullname" .) | trunc 253 | trimSuffix "-" }}
---
# cleanup: list the SealedSecrets the controller may watch, in any namespace,
# to count the values sealed with each key. With keys the agent holds the
# cluster's private keys, so this lets it decrypt every SealedSecret they
# sealed. The name has the release's namespace, so agents of several
# controllers in one cluster each have their own.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
rules:
  - apiGroups: ["bitnami.com"]
    resources: ["sealedsecrets"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $cluster }}
  labels:
    {{- include "agent.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $cluster }}
subjects:
  - kind: ServiceAccount
    name: {{ include "agent.serviceAccountName" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
