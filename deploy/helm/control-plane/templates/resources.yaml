{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "controlPlane.serviceAccountName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "controlPlane.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# the control plane knows nothing about the cluster it runs in
automountServiceAccountToken: false
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "controlPlane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "controlPlane.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "controlPlane.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "controlPlane.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "controlPlane.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "controlPlane.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "controlPlane.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      serviceAccountName: {{ include "controlPlane.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: control-plane
          image: "{{ .Values.image.repository }}:{{ default .Chart.AppVersion .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: APP_HTTP_ADDR
              value: ":8080"
            - name: APP_LOG_LEVEL
              value: {{ .Values.log.level | quote }}
            - name: APP_LOG_FORMAT
              value: {{ .Values.log.format | quote }}
            - name: APP_ENV_NAME
              value: {{ required "env is required" .Values.env | quote }}
            - name: APP_PUBLIC_URL
              value: {{ required "publicURL is required" .Values.publicURL | quote }}
            {{- with .Values.agentAudience }}
            - name: APP_AGENT_AUDIENCE
              value: {{ . | quote }}
            {{- end }}
            - name: APP_REGISTRY_FILE
              value: /etc/k8s-sealed-secrets-sealer/registry.yaml
            - name: APP_DYNAMODB_TABLE
              value: {{ required "dynamodb.table is required" .Values.dynamodb.table | quote }}
            {{- with .Values.dynamodb.endpoint }}
            - name: APP_DYNAMODB_ENDPOINT
              value: {{ . | quote }}
            {{- end }}
            {{- if .Values.dynamodb.createTable }}
            - name: APP_DYNAMODB_CREATE_TABLE
              value: "true"
            {{- end }}
            {{- with .Values.aws.region }}
            - name: AWS_REGION
              value: {{ . | quote }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          envFrom:
            - secretRef:
                name: {{ required "existingSecret is required" .Values.existingSecret }}
          volumeMounts:
            - name: registry
              mountPath: /etc/k8s-sealed-secrets-sealer
              readOnly: true
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          {{- with .Values.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
      volumes:
        - name: registry
          configMap:
            name: {{ required "registry.configMapName is required" .Values.registry.configMapName }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
