fullnameOverride: ""

image:
  repository: ghcr.io/cruxstack/k8s-sealed-secrets-sealer-control-plane
  # defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# the env this control plane serves, e.g. "dev" (required, unless envs is set)
env: ""

# Several envs on one URL, instead of env: each with its own table, transit
# key, registry and teams; the rest of the settings here are shared. People
# sign in once for all of them and switch in the UI; agents name their env.
# For example:
#   envs:
#     - name: dev
#       dynamodbTable: sealer-dev
#       kmsTransitKeyId: arn:aws:kms:us-east-2:222222222222:key/mrk-...
#     - name: prod
#       dynamodbTable: sealer-prod
#       kmsTransitKeyId: arn:aws:kms:us-east-2:333333333333:key/mrk-...
#       allowedTeams: [prod-sealers]
#       adminTeams: [platform]
# An env reads its registry from registry-<name>.yaml in the registry
# ConfigMap unless it sets registryFile or registry. Each env needs its own
# transit key, and an agent identity may be in only one env's registry. Each
# may also set kmsRegion, envAnnotation, regionAnnotation, discoveryFileGlobs
# and keyRenewPeriod; teams it sets replace github.allowedTeams and
# adminTeams. adminToken gives an env its own admin token instead of
# APP_ADMIN_TOKEN; it is written into the Deployment, so give the ARN of an
# SSM parameter holding it. adminTokenKeyChanges: true lets the env's admin
# token change keys (see adminTokenKeyChanges below).
envs: []
# the control plane's external URL (required); also the audience agent login
# tokens must carry unless agentAudience is set
publicURL: ""
agentAudience: ""

# ConfigMap holding the agent registry (the agents allowed to log in) and any
# JWKS or CA files it references, mounted at /etc/k8s-sealed-secrets-sealer
# (required): registry.yaml with env, or registry-<name>.yaml for each of
# envs that sets neither registryFile nor registry. The control plane reads
# the registry and those files again about once a minute, so a change to any
# of them needs no restart once the kubelet has updated the mounted files.
registry:
  configMapName: ""

# Secret with APP_AGENT_SESSION_KEY and APP_USER_SESSION_KEY (each at least
# 32 random bytes), APP_GITHUB_OAUTH_CLIENT_SECRET, APP_GITHUB_APP_PRIVATE_KEY
# (PEM) and, to enable the admin API, APP_ADMIN_TOKEN (required)
existingSecret: ""

# Let the admin token revoke and reinstate sealing keys, not only read the
# fleet (APP_ADMIN_TOKEN_KEY_CHANGES). Off by default: the token is often
# given to monitoring, and signed-in admins change keys from the fleet page
# either way. In v0.7.0 and v0.7.1 the token could always change keys. With
# envs, set it on each env that allows it instead.
adminTokenKeyChanges: false

# GitHub: sign-in and repository access. One GitHub App can provide both: its
# client ID and secret sign users in, and its App ID and private key read
# repositories and open pull requests. Users must belong to org and, when
# allowedTeams is set, to at least one of those teams. Use teams for prod.
# Members of adminTeams also see the fleet; with none, nobody does.
github:
  # (required)
  org: ""
  allowedTeams: []
  adminTeams: []
  # the OAuth client ID (required); its secret goes in existingSecret
  oauthClientID: ""
  # the GitHub App's ID (required); its private key goes in existingSecret
  appID: ""
  # the App's installation on org; looked up when empty
  installationID: ""
  # GitHub's web and API hosts; change for GitHub Enterprise Server
  url: https://github.com
  apiURL: https://api.github.com
  # defaults to <url>/login/oauth/access_token
  oauthTokenURL: ""
  # permit http GitHub URLs, for local mocks only
  allowInsecure: false

# how long a user stays signed in
userSessionTTL: 8h

# The annotation keys that place a SealedSecret document in an env (it
# belongs to an env when the annotation equals the env's name) and a region
# (a value that differs by region goes only into its regions' documents, and
# an agent there is preferred). Each of envs may set its own envAnnotation
# and regionAnnotation.
annotations:
  env: k8s-sealed-secrets-sealer/env
  region: k8s-sealed-secrets-sealer/region

discovery:
  # file name globs (or path globs, with a slash) read when looking for
  # SealedSecrets; empty uses the default, *sealed*.yaml and *sealed*.yml
  fileGlobs: []

# the key renewal period the control plane asks one controller to use when no
# cluster in the env renews its sealing key
keyRenewPeriod: 720h

# The KMS transit key values are encrypted under on their way to an agent.
# The control plane's IAM role needs only kms:GenerateDataKey on it: it can
# never decrypt. Each agent's role may decrypt only with its own agent_id in
# the encryption context.
kms:
  # key ID, ARN or alias (required, unless envs is set); a key in another
  # account is named by its ARN, whose region is then the one called
  transitKeyId: ""
  # region of the KMS endpoint for a key not named by ARN; empty uses
  # aws.region or the AWS SDK's
  region: ""
  # overrides the KMS endpoint, for local emulators only
  endpoint: ""

dynamodb:
  # (required, unless envs is set)
  table: ""
  # local emulators only
  endpoint: ""
  createTable: false

aws:
  # AWS_REGION for the SDK; empty uses the SDK's own lookup
  region: ""
  # STS hosts agents' signed login requests may target (aws-sts agents).
  # Empty allows sts.amazonaws.com and the regional hosts of known AWS
  # regions; set it for a newer region. Agents always sign for the regional
  # host (sts.<region>.amazonaws.com), so a control plane that reaches STS
  # through a VPC endpoint needs that endpoint's private DNS for it.
  stsHosts: []

log:
  level: info
  format: json

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  # defaults to the release's full name
  name: ""
  # for cloud identity, e.g. an IAM role; the pod never gets a Kubernetes
  # API token either way
  annotations: {}

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# extra environment variables for the control plane container
extraEnv: []
