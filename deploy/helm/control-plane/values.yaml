fullnameOverride: ""

image:
  repository: ghcr.io/cruxstack/k8s-sealed-secrets-sealer-control-plane
  # defaults to the chart's appVersion
  tag: ""
  pullPolicy: IfNotPresent

replicaCount: 1

# the env this control plane serves, e.g. "dev" (required)
env: ""
# the control plane's external URL (required); also the audience agent login
# tokens must carry unless agentAudience is set
publicURL: ""
agentAudience: ""

# ConfigMap holding registry.yaml (the agents allowed to log in) and any JWKS
# or CA files it references, mounted at /etc/k8s-sealed-secrets-sealer
# (required)
registry:
  configMapName: ""

# Secret with APP_AGENT_SESSION_KEY and APP_USER_SESSION_KEY (each at least
# 32 random bytes), APP_GITHUB_OAUTH_CLIENT_SECRET, APP_GITHUB_APP_PRIVATE_KEY
# (PEM) and, to enable the admin API, APP_ADMIN_TOKEN (required)
existingSecret: ""

# GitHub: sign-in and repository access. One GitHub App can provide both: its
# client ID and secret sign users in, and its App ID and private key read
# repositories and open pull requests. Users must belong to org and, when
# allowedTeams is set, to at least one of those teams. Use teams for prod.
# Members of adminTeams also see the fleet; with none, nobody does.
github:
  # (required)
  org: ""
  allowedTeams: []
  adminTeams: []
  # the OAuth client ID (required); its secret goes in existingSecret
  oauthClientID: ""
  # the GitHub App's ID (required); its private key goes in existingSecret
  appID: ""
  # the App's installation on org; looked up when empty
  installationID: ""
  # GitHub's web and API hosts; change for GitHub Enterprise Server
  url: https://github.com
  apiURL: https://api.github.com
  # defaults to <url>/login/oauth/access_token
  oauthTokenURL: ""
  # permit http GitHub URLs, for local mocks only
  allowInsecure: false

# how long a user stays signed in
userSessionTTL: 8h

# The annotation keys that place a SealedSecret document in an env (the
# document belongs to this deployment when it equals env) and a region (a
# preference for which cluster seals).
annotations:
  env: k8s-sealed-secrets-sealer/env
  region: k8s-sealed-secrets-sealer/region

discovery:
  # file name globs (or path globs, with a slash) read when looking for
  # SealedSecrets; empty uses the default, *sealed*.yaml and *sealed*.yml
  fileGlobs: []

# the key renewal period the control plane asks one controller to use when no
# cluster in the env renews its sealing key
keyRenewPeriod: 720h

# The KMS transit key values are encrypted under on their way to an agent.
# The control plane's IAM role needs only kms:GenerateDataKey on it: it can
# never decrypt. Each agent's role may decrypt only with its own agent_id in
# the encryption context.
kms:
  # key ID, ARN or alias (required)
  transitKeyId: ""
  # region of the KMS endpoint; empty uses aws.region or the AWS SDK's
  region: ""
  # overrides the KMS endpoint, for local emulators only
  endpoint: ""

dynamodb:
  # (required)
  table: ""
  # local emulators only
  endpoint: ""
  createTable: false

aws:
  # AWS_REGION for the SDK; empty uses the SDK's own lookup
  region: ""
  # STS hosts agents' signed login requests may target (aws-sts agents).
  # Empty allows sts.amazonaws.com and the regional hosts of known AWS
  # regions; set it for newer regions or other endpoints, such as VPC
  # endpoint host names.
  stsHosts: []

log:
  level: info
  format: json

service:
  type: ClusterIP
  port: 80

serviceAccount:
  create: true
  # defaults to the release's full name
  name: ""
  # for cloud identity, e.g. an IAM role; the pod never gets a Kubernetes
  # API token either way
  annotations: {}

podAnnotations: {}
podLabels: {}

resources:
  requests:
    cpu: 20m
    memory: 32Mi
  limits:
    memory: 256Mi

nodeSelector: {}
tolerations: []
affinity: {}

# extra environment variables for the control plane container
extraEnv: []
