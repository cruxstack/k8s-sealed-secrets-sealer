# Repositories the mock GitHub App is installed on. Each repository's files
# are the directory <owner>/<name> next to this file; they become the first
# commit of the default branch. Permissions are per mock user (alice, bob,
# carol); anyone not listed has none.
repos:
  - owner: example-org
    name: apps
    private: true
    defaultBranch: main
    permissions:
      alice: write
      bob: read
  - owner: example-org
    name: platform
    private: false
    defaultBranch: main
    permissions:
      alice: read
  - owner: example-org
    name: restricted
    private: true
    defaultBranch: main
    permissions: {}
