# worker credentials, one SealedSecret per cluster
#
# The documents disagree on purpose: queue-url and feature-flags are in all
# three, smtp-password is not in dev-use2-blue yet, and sentry-dsn is expected
# but in none, so the UI shows every state a key can be in.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: worker
  namespace: dev-use1-blue-apps
  annotations:
    k8s-sealed-secrets-sealer/env: dev
    k8s-sealed-secrets-sealer/region: use1
    k8s-sealed-secrets-sealer/description: Background jobs' queue, outgoing mail and error reporting
    k8s-sealed-secrets-sealer/keys: queue-url, smtp-password, sentry-dsn
spec:
  encryptedData:
    feature-flags: AgBplaceholderDevCiphertext00000000000000000000000000000000000==
    queue-url: AgBplaceholderDevCiphertext00000000000000000000000000000000000==
    smtp-password: AgBplaceholderDevCiphertext00000000000000000000000000000000000==
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: worker
  namespace: dev-use1-green-apps
  annotations:
    k8s-sealed-secrets-sealer/env: dev
    k8s-sealed-secrets-sealer/region: use1
    k8s-sealed-secrets-sealer/description: Background jobs' queue, outgoing mail and error reporting
    k8s-sealed-secrets-sealer/keys: queue-url, smtp-password, sentry-dsn
spec:
  encryptedData:
    feature-flags: AgBplaceholderDevCiphertext00000000000000000000000000000000000==
    queue-url: AgBplaceholderDevCiphertext00000000000000000000000000000000000==
    smtp-password: AgBplaceholderDevCiphertext00000000000000000000000000000000000==
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: worker
  namespace: dev-use2-blue-apps
  annotations:
    k8s-sealed-secrets-sealer/env: dev
    k8s-sealed-secrets-sealer/region: use2
    k8s-sealed-secrets-sealer/description: Background jobs' queue, outgoing mail and error reporting
    k8s-sealed-secrets-sealer/keys: queue-url, smtp-password, sentry-dsn
spec:
  encryptedData:
    feature-flags: AgBplaceholderDevCiphertext00000000000000000000000000000000000==
    queue-url: AgBplaceholderDevCiphertext00000000000000000000000000000000000==
