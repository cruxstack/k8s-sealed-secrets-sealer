# billing credentials, one SealedSecret per cluster
#
# The dev documents target the local stack's simulated clusters; one seal
# updates all three.
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: billing
  namespace: dev-use1-blue-apps
  annotations:
    k8s-sealed-secrets-sealer/env: dev
    k8s-sealed-secrets-sealer/region: use1
spec:
  encryptedData: {}
  template:
    metadata:
      labels:
        app: billing
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: billing
  namespace: dev-use1-green-apps
  annotations:
    k8s-sealed-secrets-sealer/env: dev
    k8s-sealed-secrets-sealer/region: use1
spec:
  encryptedData: {}
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: billing
  namespace: dev-use2-blue-apps
  annotations:
    k8s-sealed-secrets-sealer/env: dev
    k8s-sealed-secrets-sealer/region: use2
spec:
  encryptedData: {}
---
# another env's document: never shown or changed by the dev deployment
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: billing
  namespace: billing
  annotations:
    k8s-sealed-secrets-sealer/env: prod
    k8s-sealed-secrets-sealer/region: use1
spec:
  encryptedData:
    api-key: AgBplaceholderProdCiphertext0000000000000000000000000000000000==
