# Local overrides for deploy/helm/agent. Tilt sets controller.namespace per
# simulated cluster and swaps the image for the one it builds.
image:
  repository: local.invalid/sealer-agent
  tag: dev

controlPlane:
  url: http://sealer-control-plane.sealer-system.svc.cluster.local
  # in-cluster plain http, local stack only
  allowInsecure: true

identity:
  # Tilt sets it to the control plane's publicURL for this stack
  audience: http://localhost:4100

env: dev

capabilities:
  seal: true
  keys: true
  renewal: true
  cleanup: true
  reseal: true

kms:
  transitKeyId: alias/sealer-transit
  escrowKeyId: alias/sealer-escrow
  region: us-east-1
  endpoint: http://local-kms.sealer-system.svc.cluster.local:8080

# local KMS accepts any credentials; these are not secrets
extraEnv:
  - name: AWS_ACCESS_KEY_ID
    value: local
  - name: AWS_SECRET_ACCESS_KEY
    value: local

# faster than the 15s default, so the local stack settles quickly
checkinInterval: 5s
# faster than the 5m default, so keys can be deleted soon after revoking
keyUsageInterval: 30s

log:
  level: debug
  format: json
