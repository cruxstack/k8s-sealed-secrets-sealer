# Local overrides for the upstream sealed-secrets chart. Tilt renders it once
# per simulated cluster and adds the namespace-specific arguments.

# kubeseal's default name, which the agent chart also defaults to
fullnameOverride: sealed-secrets-controller

# No cluster-scoped RBAC, so several controllers can share one k3d cluster.
# The chart creates Roles in additionalNamespaces; the Tiltfile adds one for
# the controller's own namespace.
rbac:
  clusterRole: false
  namespacedRoles: true
  serviceProxier:
    create: false

# the agent chart grants the agent its own access to the controller
