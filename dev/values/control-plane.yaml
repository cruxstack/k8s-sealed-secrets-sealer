# Local overrides for deploy/helm/control-plane. Tilt swaps the image for the
# one it builds and generates the registry ConfigMap from dev/stack.yaml and
# the k3d cluster's service-account issuer.
image:
  repository: local.invalid/sealer-control-plane
  tag: dev

# Two envs on one URL: dev, whose clusters run here (dev/stack.yaml), and
# prod, whose cluster does not, for the sealer-admins team only. Each reads
# its registry from registry-<env>.yaml, which Tilt generates.
envs:
  - name: dev
    dynamodbTable: sealer
    kmsTransitKeyId: alias/sealer-transit
  - name: prod
    dynamodbTable: sealer-prod
    # each env needs its own transit key
    kmsTransitKeyId: alias/sealer-transit-prod
    allowedTeams: [sealer-admins]

# Tilt sets publicURL and github.url to this stack's localhost ports, so the
# OAuth redirects work for worktree and e2e stacks too
publicURL: http://localhost:4100

# the GitHub mock (dev/k3d/mock-github.yaml): alice and dave may sign in and
# alice is an admin, bob is not in the allowed team, carol is not in the org
github:
  org: example-org
  allowedTeams: [sealers]
  adminTeams: [sealer-admins]
  oauthClientID: local-client-id
  # the mock's App; Tilt generates its key pair (APP_GITHUB_APP_PRIVATE_KEY)
  appID: "1"
  url: http://localhost:4104
  apiURL: http://mock-github.sealer-system.svc.cluster.local:8080
  oauthTokenURL: http://mock-github.sealer-system.svc.cluster.local:8080/login/oauth/access_token
  allowInsecure: true

registry:
  configMapName: sealer-registry

existingSecret: sealer-control-plane-local

dynamodb:
  endpoint: http://dynamodb-local.sealer-system.svc.cluster.local:8000
  createTable: true

kms:
  endpoint: http://local-kms.sealer-system.svc.cluster.local:8080

aws:
  region: us-east-1

# faster than the 1m default, so reseal runs move on quickly here; each open
# reseal pull request is checked about every 15 ticks (75s)
tickInterval: 5s

log:
  level: debug
  format: json
