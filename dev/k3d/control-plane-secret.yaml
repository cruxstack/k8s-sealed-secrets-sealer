# Secrets for the local control plane. These values are public, protect
# nothing outside this local stack, and must never be used anywhere else.
apiVersion: v1
kind: Secret
metadata:
  name: sealer-control-plane-local
  namespace: sealer-system
type: Opaque
stringData:
  APP_AGENT_SESSION_KEY: local-only-agent-session-key-0123456789abcdef
  APP_ADMIN_TOKEN: local-only-admin-token-0123456789abcdef
  APP_USER_SESSION_KEY: local-only-user-session-key-0123456789abcdef
  # DynamoDB Local accepts any credentials, but the AWS SDK requires some
  AWS_ACCESS_KEY_ID: local
  AWS_SECRET_ACCESS_KEY: local
