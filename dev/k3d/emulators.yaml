# Local stand-ins for AWS services, in namespace sealer-system. The control
# plane and agents use the real AWS SDK with their endpoints pointed here.
#
# local KMS reads its keys from the local-kms-seed ConfigMap, which the
# Tiltfile builds from dev/local-kms/seed.yaml.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: local-kms
  namespace: sealer-system
  labels:
    app.kubernetes.io/name: sealer-emulator
    app.kubernetes.io/component: kms
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sealer-emulator
      app.kubernetes.io/component: kms
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sealer-emulator
        app.kubernetes.io/component: kms
    spec:
      automountServiceAccountToken: false
      containers:
        - name: local-kms
          image: nsmithuk/local-kms:3.11.7@sha256:360d7377b6f3687c89a622236791e4fa3f7316366267b437829edbdfa8a5fc60
          env:
            - name: PORT
              value: "8080"
            - name: KMS_REGION
              value: us-east-1
            - name: KMS_ACCOUNT_ID
              value: "000000000000"
            - name: KMS_SEED_PATH
              value: /init/seed.yaml
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          volumeMounts:
            - name: seed
              mountPath: /init
              readOnly: true
            - name: data
              mountPath: /data
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 64Mi
      volumes:
        - name: seed
          configMap:
            name: local-kms-seed
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: local-kms
  namespace: sealer-system
  labels:
    app.kubernetes.io/name: sealer-emulator
    app.kubernetes.io/component: kms
spec:
  selector:
    app.kubernetes.io/name: sealer-emulator
    app.kubernetes.io/component: kms
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dynamodb-local
  namespace: sealer-system
  labels:
    app.kubernetes.io/name: sealer-emulator
    app.kubernetes.io/component: dynamodb
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: sealer-emulator
      app.kubernetes.io/component: dynamodb
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sealer-emulator
        app.kubernetes.io/component: dynamodb
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dynamodb-local
          image: amazon/dynamodb-local:3.3.2@sha256:6ada631ec7aa5fc83446855eb17233e3dad184fec47477e8140c6c569cfe0c86
          # in memory: a restart starts from empty tables, like a fresh env
          args: ["-jar", "DynamoDBLocal.jar", "-inMemory", "-sharedDb", "-port", "8000"]
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 2
          resources:
            requests:
              cpu: 20m
              memory: 256Mi
            limits:
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: dynamodb-local
  namespace: sealer-system
  labels:
    app.kubernetes.io/name: sealer-emulator
    app.kubernetes.io/component: dynamodb
spec:
  selector:
    app.kubernetes.io/name: sealer-emulator
    app.kubernetes.io/component: dynamodb
  ports:
    - name: http
      port: 8000
      targetPort: http
