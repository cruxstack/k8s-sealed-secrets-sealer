# The simulated env the local stack runs. Each cluster here becomes three
# namespaces of one k3d cluster: <name>-sealed-secrets (its own controller and
# keys), <name>-sealer (its agent) and <name>-apps (where e2e tests apply
# SealedSecrets). Every controller watches only its own two namespaces, so the
# clusters are as separate as they can be inside one Kubernetes API.
env: dev
clusters:
  - name: dev-use1-blue
    region: use1
  - name: dev-use1-green
    region: use1
  - name: dev-use2-blue
    region: use2

# A second env the same control plane serves, whose clusters do not run
# here: it lists prod's SealedSecrets, says sealing is unavailable without
# its agents, and is for the sealer-admins team only.
otherEnvs:
  - env: prod
    clusters:
      - name: prod-use1-blue
        region: use1
